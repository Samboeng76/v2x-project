[project]
name = "v2x-project"
version = "0.1.0"
description = "Generate and inspect SAE J2735 MAP and SPaT messages"
readme = "README.md"
authors = [
    { name = "Sam English", email = "sbe80@msstate.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "j2735-202409==0.1.0",
    "pycrate>=0.8.1",
    "pyjson5>=2.0.1",
]

[tool.uv.sources]
j2735-202409 = { path = "src/j2735_202409/dist/j2735_202409-0.1.0-py3-none-any.whl" }

[project.scripts]
v2x-project = "v2x_project:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
